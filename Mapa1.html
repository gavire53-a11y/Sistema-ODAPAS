<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Mapa Chimalhuacán</title>

<link href="https://unpkg.com/maplibre-gl@3.6.0/dist/maplibre-gl.css" rel="stylesheet"/>
<script src="https://unpkg.com/maplibre-gl@3.6.0/dist/maplibre-gl.js"></script>

<style>
body { margin:0; }
#map { width:100%; height:100vh; }
</style>
</head>

<body>

<div id="map"></div>

<script>

const map = new maplibregl.Map({
 container: 'map',
 style: 'https://demotiles.maplibre.org/style.json',
 center: [-98.95,19.41], 
 zoom: 12
});

map.addControl(new maplibregl.NavigationControl());

async function cargarDatos() {

 const query = `
 [out:json];
 area["name"="Chimalhuacán"]->.searchArea;

 (
  node["leisure"="park"](area.searchArea);
  way["leisure"="park"](area.searchArea);
  relation["leisure"="park"](area.searchArea);

  node["natural"="cliff"](area.searchArea);
  node["landuse"="landfill"](area.searchArea);
  node["waterway"="drain"](area.searchArea);
 );
 out center;
 `;

 const url = "https://overpass-api.de/api/interpreter?data=" + encodeURIComponent(query);

 const res = await fetch(url);
 const data = await res.json();

 data.elements.forEach(el => {

   let lat = el.lat || el.center?.lat;
   let lon = el.lon || el.center?.lon;

   if(!lat || !lon) return;

   let color = "red";

   if(el.tags?.leisure === "park"){
     color = "green";
   }

   const marker = document.createElement("div");
   marker.style.width = "12px";
   marker.style.height = "12px";
   marker.style.borderRadius = "50%";
   marker.style.background = color;

   new maplibregl.Marker(marker)
   .setLngLat([lon,lat])
   .addTo(map);

 });

}

map.on('load', cargarDatos);

</script>

</body>
</html>
